name: Flutter Analyze

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Use the same Flutter version as local development and deployment.
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: dart pub get --directory packages/exact_cover_dlx
      - run: dart run intl_utils:generate
      - run: dart run build_runner build
      - run: flutter analyze
